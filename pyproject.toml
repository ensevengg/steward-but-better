[project]
name = "steward-but-better"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2",
  "fastf1>=3.4,<4", "pandas>=2.2,<3", "numpy>=1.26,<3", "requests>=2.31,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "playwright>=1.50,<2", "ruff>=0.12,<1", "faiss-cpu>=1.8,<2"]
indexing = ["sentence-transformers>=3,<6", "mistralai>=1,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src/brain", "src/telemetry"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
